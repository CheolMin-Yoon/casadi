[project]
name = "generalist-casadi-runtime"
version = "0.1.0"
description = "Separate Generalist training and CasADi/Pinocchio CUDA-codegen environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab==1.6.0",
    "mjlab-skills==0.1.0",
    "numpy<2.5",
    "rsl-rl-lib==5.5.1",
    "rsl-rl-skills==0.1.0",
    "torch==2.14.0+cu130",
    "torch-skills==0.1.0",
    "warp-lang==1.17.0",
    "casadi==3.8.1.post0+cuda.7217fce9a",
    "pin==4.1.0",
    "pinocchio-casadi==4.1.0+ca7217fce9a",
    "casadi-on-gpu==0.1.0+g1.ca7217fce9a",
    "casadi-skills==0.1.0",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]
build = ["cmeel-eigen", "cmeel-urdfdom-headers", "jrl-cmakemodules", "swig", "ninja", "pybind11", "wheel", "scikit-build-core", "patchelf", "pyright"]

